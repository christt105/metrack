services:
  metrack:
    image: ghcr.io/christt105/metrack:${METRACK_TAG:-latest}
    container_name: metrack
    restart: unless-stopped
    ports:
      - '${METRACK_PORT:-8097}:8097'
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-es-ES}
      STEAMGRIDDB_TOKEN: ${STEAMGRIDDB_TOKEN:-}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_TOKEN: ${JELLYFIN_TOKEN:-}
      JELLYFIN_USER: ${JELLYFIN_USER:-admin}
      JELLYSTAT_DB_HOST: ${JELLYSTAT_DB_HOST:-}
      JELLYSTAT_DB_PORT: ${JELLYSTAT_DB_PORT:-5432}
      JELLYSTAT_DB_USER: ${JELLYSTAT_DB_USER:-postgres}
      JELLYSTAT_DB_PASSWORD: ${JELLYSTAT_DB_PASSWORD:-}
      JELLYSTAT_DB_NAME: ${JELLYSTAT_DB_NAME:-jellystat}
      SYNC_TIME_ZONE: ${SYNC_TIME_ZONE:-Europe/Madrid}
      SYNC_WEBHOOK_DELAY_SECONDS: ${SYNC_WEBHOOK_DELAY_SECONDS:-120}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
      ALERTS_TIMEZONE: ${ALERTS_TIMEZONE:-Europe/Madrid}
      ALERTS_NOTIFY_FROM_HOUR: ${ALERTS_NOTIFY_FROM_HOUR:-8}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
    volumes:
      - ${METRACK_DATA:-./data}:/data
