services:
  metrack:
    image: ghcr.io/christt105/metrack:${METRACK_TAG:-latest}
    container_name: metrack
    restart: unless-stopped
    ports:
      - '${METRACK_PORT:-8097}:8097'
    environment:
      DEV_LOGIN: ${DEV_LOGIN:-false}
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-es-ES}
      STEAMGRIDDB_TOKEN: ${STEAMGRIDDB_TOKEN:-}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      CLOUDFLARE_USAGE_TOKEN: ${CLOUDFLARE_USAGE_TOKEN:-}
      CLOUDFLARE_ACCOUNT_ID: ${CLOUDFLARE_ACCOUNT_ID:-}
      CLOUDFLARE_USAGE_WARN_PERCENT: ${CLOUDFLARE_USAGE_WARN_PERCENT:-}
      CLOUDFLARE_USAGE_CRITICAL_PERCENT: ${CLOUDFLARE_USAGE_CRITICAL_PERCENT:-}
      CLOUDFLARE_LIMIT_WORKER_REQUESTS: ${CLOUDFLARE_LIMIT_WORKER_REQUESTS:-}
      CLOUDFLARE_LIMIT_D1_ROWS_READ: ${CLOUDFLARE_LIMIT_D1_ROWS_READ:-}
      CLOUDFLARE_LIMIT_D1_ROWS_WRITTEN: ${CLOUDFLARE_LIMIT_D1_ROWS_WRITTEN:-}
      CLOUDFLARE_LIMIT_D1_STORAGE_BYTES: ${CLOUDFLARE_LIMIT_D1_STORAGE_BYTES:-}
      CLOUDFLARE_LIMIT_R2_CLASS_A: ${CLOUDFLARE_LIMIT_R2_CLASS_A:-}
      CLOUDFLARE_LIMIT_R2_CLASS_B: ${CLOUDFLARE_LIMIT_R2_CLASS_B:-}
      CLOUDFLARE_LIMIT_R2_STORAGE_BYTES: ${CLOUDFLARE_LIMIT_R2_STORAGE_BYTES:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_TOKEN: ${JELLYFIN_TOKEN:-}
      JELLYFIN_USER: ${JELLYFIN_USER:-admin}
      JELLYSTAT_DB_HOST: ${JELLYSTAT_DB_HOST:-}
      JELLYSTAT_DB_PORT: ${JELLYSTAT_DB_PORT:-5432}
      JELLYSTAT_DB_USER: ${JELLYSTAT_DB_USER:-postgres}
      JELLYSTAT_DB_PASSWORD: ${JELLYSTAT_DB_PASSWORD:-}
      JELLYSTAT_DB_NAME: ${JELLYSTAT_DB_NAME:-jellystat}
      SYNC_TIME_ZONE: ${SYNC_TIME_ZONE:-Europe/Madrid}
      SYNC_WEBHOOK_DELAY_SECONDS: ${SYNC_WEBHOOK_DELAY_SECONDS:-120}
      SYNC_WEBHOOK_SECRET: ${SYNC_WEBHOOK_SECRET:-}
      PUBLIC_URL: ${PUBLIC_URL:-}
      CONTACT_EMAIL: ${CONTACT_EMAIL:-}
      ALERTS_ENABLED: ${ALERTS_ENABLED:-true}
      ALERTS_TIMEZONE: ${ALERTS_TIMEZONE:-Europe/Madrid}
      ALERTS_NOTIFY_FROM_HOUR: ${ALERTS_NOTIFY_FROM_HOUR:-8}
      BACKUP_ENABLED: ${BACKUP_ENABLED:-true}
      BACKUP_DIR: ${BACKUP_DIR:-/data/backups}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
      BACKUP_INTERVAL_HOURS: ${BACKUP_INTERVAL_HOURS:-24}
      BACKUP_COPY_DIR: ${BACKUP_COPY_DIR:-}
      BACKUP_COPY_RETENTION: ${BACKUP_COPY_RETENTION:-14}
    volumes:
      - ${METRACK_DATA:-./data}:/data
