services:
  metrack:
    build: .
    image: metrack:local
    container_name: metrack
    restart: unless-stopped
    ports:
      - '${METRACK_PORT:-8097}:8097'
    environment:
      TMDB_API_KEY: ${TMDB_API_KEY:-}
      TMDB_LANGUAGE: ${TMDB_LANGUAGE:-es-ES}
      STEAMGRIDDB_TOKEN: ${STEAMGRIDDB_TOKEN:-}
      NTFY_URL: ${NTFY_URL:-}
      NTFY_TOPIC: ${NTFY_TOPIC:-}
      NTFY_TOKEN: ${NTFY_TOKEN:-}
      JELLYFIN_URL: ${JELLYFIN_URL:-}
      JELLYFIN_TOKEN: ${JELLYFIN_TOKEN:-}
      JELLYFIN_USER: ${JELLYFIN_USER:-admin}
      JELLYSTAT_DB_HOST: ${JELLYSTAT_DB_HOST:-}
      JELLYSTAT_DB_PORT: ${JELLYSTAT_DB_PORT:-5432}
      JELLYSTAT_DB_USER: ${JELLYSTAT_DB_USER:-postgres}
      JELLYSTAT_DB_PASSWORD: ${JELLYSTAT_DB_PASSWORD:-}
      JELLYSTAT_DB_NAME: ${JELLYSTAT_DB_NAME:-jellystat}
      SYNC_TIME_ZONE: ${SYNC_TIME_ZONE:-Europe/Madrid}
      BACKUP_RETENTION: ${BACKUP_RETENTION:-14}
    volumes:
      - ${METRACK_DATA:-./data}:/data
